# Gated GitHub issues -> pm tracker sync. The audited pipeline lives in pm-github;
# this caller only owns the schedule. Requires Settings -> Actions -> "Allow GitHub
# Actions to create and approve pull requests" (enabled by the orchestrator).
name: Sync GitHub issues into pm
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write
jobs:
  gated-sync:
    uses: unbraind/pm-github/.github/workflows/pm-github-sync.yml@a935d7b9cefde7c5099e552914653217e1024c3f # pm-github 2026.11.02
    with:
      post-import-script: "changelog:automation"
      pm-github-version: "2026.10.28"
